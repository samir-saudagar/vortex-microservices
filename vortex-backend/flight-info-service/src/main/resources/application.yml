server:
  port: 8084

spring:
  application:
    name: flight-info-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/flight_db
    username: ${POSTGRES_USER:vortex_admin_samir}
    password: ${POSTGRES_PASSWORD:vortex_admin_samir_samirsaudagar}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
#  Kafka: provided custom bean in Kafka config because default bean is not working
#    bootstrap-servers: localhost:9092
