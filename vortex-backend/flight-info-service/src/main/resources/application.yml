resilience4j:
  circuitbreaker:
    instances:
      flightApi:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
  retry:
    instances:
      flightApi:
        maxAttempts: 3
        waitDuration: 200ms
